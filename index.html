<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#f5f2ea" />
</head>
<body>
    <div class="page-shell" aria-hidden="true">
        <div class="grid-field"></div>
        <div class="sun-disc"></div>
    </div>

    <main class="container">
        <section class="workspace" aria-label="Gateway workspace">
            <div class="status-strip" aria-label="Gateway status">
                <span class="status-mark"></span>
                <span>Gateway</span>
                <span id="systemState">Ready</span>
            </div>

            <section id="center-widget" class="time-panel" aria-label="Clock and weather widget">
                <p class="panel-kicker">Local Station</p>
                <div class="widget-inner">
                    <div id="time" aria-live="polite">00:00</div>
                    <div id="date">Loading...</div>
                    <button id="weather" class="weather-chip" type="button" aria-live="polite">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Loading weather...</span>
                    </button>
                </div>
            </section>

            <section class="launch-preview" aria-label="Quick launch preview">
                <div>
                    <p class="panel-kicker">Launch Deck</p>
                    <h1>Start from one clean command surface.</h1>
                </div>
                <button id="openStartInline" class="primary-action" type="button">
                    <i class="fas fa-compass" aria-hidden="true"></i>
                    Open
                </button>
            </section>
        </section>

        <aside id="notifications-container" class="notification-stack" aria-label="Live Hacker News feed">
            <div class="notification-card" id="hn-skeleton">
                <div class="notification-skeleton">
                    <div class="skeleton-bar wide"></div>
                    <div class="skeleton-bar"></div>
                    <div class="skeleton-bar short"></div>
                </div>
            </div>
        </aside>
    </main>

    <div class="taskbar" role="toolbar" aria-label="Gateway controls">
        <button id="btnTheme" class="task-btn" title="Toggle theme" aria-label="Toggle theme" onclick="window.toggleTheme && window.toggleTheme()">
            <i class="fas fa-circle-half-stroke" aria-hidden="true"></i>
        </button>
        <button id="btnStart" class="task-btn start-btn" title="Open launch deck" aria-haspopup="dialog" aria-expanded="false" aria-controls="startMenu" onclick="window.toggleStartMenu && window.toggleStartMenu()">
            <i class="fas fa-grip" aria-hidden="true"></i>
        </button>
        <button id="btnRefresh" class="task-btn" title="Refresh" aria-label="Refresh" onclick="window.doRefresh && window.doRefresh()">
            <i class="fas fa-rotate" aria-hidden="true"></i>
        </button>
    </div>

    <div id="overlay" class="overlay" hidden></div>

    <section id="startMenu" class="start-menu" role="dialog" aria-modal="true" aria-labelledby="startTitle" hidden>
        <div class="start-inner">
            <div class="start-header">
                <div>
                    <p class="panel-kicker">Command Center</p>
                    <h2 id="startTitle">Quick Launch</h2>
                </div>
                <div class="start-search">
                    <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                    <input id="siteSearch" type="search" placeholder="Search sites..." aria-label="Search sites" />
                </div>
            </div>
            <div id="siteGrid" class="site-grid" aria-live="polite" aria-label="Sites"></div>
            <div class="start-footer">
                <button id="prevPage" class="nav-btn" aria-label="Previous page"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
                <div id="pageDots" class="page-dots" role="tablist" aria-label="Pages"></div>
                <button id="nextPage" class="nav-btn" aria-label="Next page"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
            </div>
        </div>
    </section>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
